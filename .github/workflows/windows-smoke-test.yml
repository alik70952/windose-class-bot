name: Windows smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install with project installer
        shell: cmd
        env:
          CI: '1'
        run: install.bat --no-pause --skip-browser
      - name: Diagnose installation
        shell: cmd
        env:
          CI: '1'
        run: diagnose.bat --no-pause
      - name: Import startup modules
        run: |
          .\.venv\Scripts\python.exe -c "import src.app"
          .\.venv\Scripts\python.exe -c "import customtkinter; import keyring; import playwright"
      - name: Compile Python files
        run: .\.venv\Scripts\python.exe -m compileall main.py src
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Smoke test CLI entry point without UI
        run: .\.venv\Scripts\python.exe -c "import main; raise SystemExit(main.main(['--run-schedule','__missing__']) == 1 and 0 or 1)"
